[project]
name = "ab-test-analysis"
version = "0.1.0"
description = "A/B test analysis: mobile vs desktop conversion on the Google Merchandise Store (GA360 sample data)"
requires-python = ">=3.10"
dependencies = [
    "google-cloud-bigquery>=3.25.0",
    "db-dtypes>=1.2.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "jupyter>=1.0.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.32.0"]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
