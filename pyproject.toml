[project]
name = "xpkit"
version = "0.2.0"
description = "Experimentation and causal-inference toolkit: trust checks, CUPED, sequential testing, propensity/IPW, DiD, uplift modeling, validated by simulation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Legacy GA360 pull (src/ab_test_analysis/data.py, case_studies/03_ga360.py). Needs GCP credentials.
bigquery = ["google-cloud-bigquery>=3.25.0", "db-dtypes>=1.2.0", "pyarrow>=15.0.0"]
notebook = ["jupyter>=1.0.0", "seaborn>=0.13.0"]
app = ["streamlit>=1.32.0"]
dev = ["pytest>=8.0.0", "ruff>=0.8.0", "mypy>=1.10", "pre-commit>=3.7", "pandas-stubs>=2.2", "types-PyYAML>=6.0"]

[project.scripts]
xpkit-report = "xpkit.report.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xpkit = ["report/templates/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: Monte Carlo validation tests (deselect with -m 'not slow')",
]
filterwarnings = ["error::FutureWarning:xpkit.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.format]
# Legacy analysis files keep their original formatting (lint still applies).
exclude = ["src/ab_test_analysis/*", "tests/test_power.py", "tests/test_stats_tests.py", "tests/test_traps.py", "app/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow unicode math symbols in docstrings

[tool.ruff.lint.per-file-ignores]
# Legacy analysis kept byte-for-byte where possible; long lines left as originally written.
"app/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/xpkit"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
