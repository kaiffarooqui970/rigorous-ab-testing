name: ci
on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install (pinned)
        run: make install
      - name: Lint
        run: make lint
      - name: Fast tests (no credentials, no downloads)
        run: make test
      - name: Demo on synthetic data
        run: make demo
